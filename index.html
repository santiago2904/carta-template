<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"

    <title>Para ti, Kata</title>
    <style>
      :root {
        --paper: #fbf4ec;
        --paper-2: #f4e6d8;
        --ink: #3a2f2b;
        --ink-soft: #6b5a51;
        --rose: #b4576a;
        --rose-deep: #8f3f50;
        --gold: #c79a5b;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
          Georgia, serif;
        --script: "Snell Roundhand", "Segoe Script", "Bradley Hand", cursive;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--serif);
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 15% -10%, #fff7f0 0%, transparent 60%),
          radial-gradient(
            800px 600px at 110% 115%,
            #f0d7dd 0%,
            transparent 55%
          ),
          linear-gradient(160deg, #f7ece1, #eed9ca);
        -webkit-font-smoothing: antialiased;
        touch-action: pan-y;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .ic {
        position: absolute;
        color: var(--rose);
        animation: drift 18s ease-in-out infinite;
      }
      .ic.g {
        color: var(--gold);
      }
      .ic svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ic.emo {
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        filter: grayscale(0.2) sepia(0.1);
      }
      @keyframes drift {
        0%,
        100% {
          transform: translateY(0) rotate(var(--r, 0deg));
        }
        50% {
          transform: translateY(-14px) rotate(calc(var(--r, 0deg) + 4deg));
        }
      }

      .book {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
      }
      .stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        padding: calc(env(safe-area-inset-top) + 34px) 26px 26px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        pointer-events: none;
      }
      .card.active {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .wrap {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      p {
        font-size: 19px;
        line-height: 1.72;
        color: var(--ink);
        text-wrap: pretty;
        min-height: 1.2em;
      }
      p.soft {
        color: var(--ink-soft);
        font-style: italic;
      }
      p.lead {
        font-size: 22px;
        line-height: 1.55;
      }
      p.accent {
        font-size: 24px;
        line-height: 1.4;
        color: var(--rose-deep);
        font-weight: 600;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--rose-deep);
        opacity: 0;
        transition: opacity 0.6s ease 0.1s;
      }
      .active .eyebrow {
        opacity: 0.9;
      }

      /* typewriter cursor */
      .tw.typing::after {
        content: "▌";
        color: var(--rose);
        margin-left: 1px;
        animation: blink 0.9s steps(1) infinite;
        font-weight: 400;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* cover */
      .cover {
        text-align: center;
        align-items: center;
        justify-content: center;
      }
      .cover .heart {
        font-size: 50px;
        color: var(--rose);
        animation: beat 2.4s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.18);
        }
        24% {
          transform: scale(1);
        }
      }
      .cover h1 {
        font-family: var(--script);
        font-size: clamp(52px, 17vw, 84px);
        color: var(--rose-deep);
        font-weight: 400;
        line-height: 1;
        margin: 8px 0 16px;
      }
      .cover .sub {
        color: var(--ink-soft);
        font-style: italic;
        font-size: 17px;
      }

      p.sign {
        font-family: var(--script);
        font-size: 44px;
        color: var(--rose-deep);
        line-height: 1;
        margin-top: 2px;
      }
      p.pd {
        font-size: 15px;
        color: var(--ink-soft);
        border-top: 1px solid rgba(199, 154, 91, 0.45);
        padding-top: 16px;
        margin-top: 8px;
        font-style: italic;
      }

      .after {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
        pointer-events: none;
      }
      .after.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .spotify {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        align-self: flex-start;
        background: #1db954;
        color: #fff;
        text-decoration: none;
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 600;
        padding: 15px 22px;
        border-radius: 999px;
        box-shadow: 0 10px 24px -6px rgba(29, 185, 84, 0.6);
      }
      .spotify:active {
        transform: scale(0.97);
      }
      .spotify svg {
        width: 21px;
        height: 21px;
        fill: #fff;
      }

      /* nav */
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px calc(env(safe-area-inset-bottom) + 16px);
      }
      .progress {
        flex: 1;
        height: 4px;
        border-radius: 99px;
        background: rgba(143, 63, 80, 0.18);
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--rose), var(--gold));
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      .count {
        font-size: 13px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: center;
      }
      .arrow {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(180, 87, 106, 0.35);
        color: var(--rose-deep);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .arrow:disabled {
        opacity: 0.3;
      }
      .arrow:active:not(:disabled) {
        background: var(--rose);
        color: #fff;
      }

      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
        font-style: italic;
        opacity: 0.75;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      .hint.gone {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: opacity 0.2s;
        }
        .tw.typing::after {
          display: none;
        }
      }
      @media (min-width: 640px) {
        p {
          font-size: 20px;
        }
        .card {
          padding-top: 60px;
        }
      }
    </style>
  </head>

    <script>
      const SPOTIFY = "https://open.spotify.com/track/4ZOkfHC38nxSeSqzGE5HFr";

      // ===== Notificación al abrir la carta (ntfy.sh) =====
      // 1) Instala la app "ntfy" en tu celular (iOS/Android) o abre https://ntfy.sh
      // 2) Suscríbete EXACTAMENTE a este tema (topic):

      // 3) Listo: cuando alguien abra la página, te llega un push.
      (async function () {
        try {
          if (!NTFY_TOPIC) return;
          var ua = navigator.userAgent;
          var lang = navigator.language || "";
          var scr = (screen.width || "?") + "x" + (screen.height || "?");
          var when = new Date().toLocaleString("es-CO");
          var geo = "";
          try {
            var r = await fetch("https://ipwho.is/");
            var j = await r.json();
            if (j && j.success !== false) {
              geo = [j.city, j.region, j.country].filter(Boolean).join(", ");
              if (j.connection && j.connection.isp)
                geo += " · " + j.connection.isp;
              if (j.ip) geo += " · IP " + j.ip;
            }
          } catch (e) {}
          var body =
            "📍 " +
            (geo || "ubicación desconocida") +
            "\n" +
            "📱 " +
            ua +
            "\n" +
            "🖥️ " +
            scr +
            " · " +
            lang +
            "\n" +
            "🕒 " +
            when;
          fetch("https://ntfy.sh/" + NTFY_TOPIC, {
            method: "POST",
            body: body,
            headers: {
              Title: "Abrieron la carta",
              Priority: "high",
              Tags: "heart",
            },
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
      const P = [

        d.className = "ic" + (gold ? " g" : "") + (emoji ? " emo" : "");
        d.style.cssText =
          `left:${l}%;top:${tp}%;width:${s}px;height:${s}px;opacity:${op};--r:${r}deg;animation-duration:${dur}s;animation-delay:-${n}s` +
          (emoji ? `;font-size:${Math.round(s * 0.9)}px` : "");
        d.innerHTML = emoji
          ? t
          : `<svg viewBox="0 0 24 24"><use href="#ic-${t}"/></svg>`;
        bg.appendChild(d);
      });

      let i = 0,
        typing = false,
        skip = false,
        token = 0;
      const prevB = document.getElementById("prev"),
        nextB = document.getElementById("next");
      const count = document.getElementById("count"),
        pfill = document.getElementById("pfill");
      const hint = document.getElementById("hint");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const delayFor = (ch) => {
        if (".!?…".includes(ch)) return 240;
        if (",;:—".includes(ch)) return 130;
        return 18;
      };

      async function typeCard(c) {
        const my = ++token;
        typing = true;
        skip = false;
        const els = [...c.querySelectorAll(".tw")];
        els.forEach((e) => (e.textContent = ""));
        c.querySelectorAll(".after").forEach((e) => e.classList.remove("show"));
        if (reduced) {
          els.forEach((e) => (e.textContent = e.dataset.t));
          c.querySelectorAll(".after").forEach((e) => e.classList.add("show"));
          typing = false;
          return;
        }
        for (const e of els) {
          e.classList.add("typing");
          const t = e.dataset.t;
          for (let k = 0; k < t.length; k++) {
            if (my !== token) return;
            if (skip) {
              e.textContent = t;
              break;
            }
            e.textContent = t.slice(0, k + 1);
            await sleep(delayFor(t[k]));
          }
          if (my !== token) return;
          e.textContent = t;
          e.classList.remove("typing");
          if (skip) {
            els.forEach((x) => (x.textContent = x.dataset.t));
            break;
          }
          await sleep(200);
        }
        if (my !== token) return;
        c.querySelectorAll(".after").forEach((e) => e.classList.add("show"));
        typing = false;
      }
      function render() {
        cards.forEach((c, n) => c.classList.toggle("active", n === i));
        prevB.disabled = i === 0;
        nextB.disabled = i === P.length - 1;
        count.textContent = i + 1 + " / " + P.length;
        pfill.style.width = (i / (P.length - 1)) * 100 + "%";
        if (!P[i].cover) typeCard(cards[i]);
        else {
          typing = false;
          token++;
        }
      }
      function next() {
        if (typing) {
          skip = true;
          return;
        }
        if (i < P.length - 1) {
          i++;
          render();
        }
      }
      function prev() {
        if (i > 0) {
          i--;
          render();
        }
      }
      nextB.onclick = next;
      prevB.onclick = prev;
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
      });

      const canScroll = (c) => c.scrollHeight - c.clientHeight > 4;
      let sx = 0,
        sy = 0;
      stage.addEventListener(
        "touchstart",
        (e) => {
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
        },
        { passive: true },
      );
      stage.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - sx,
            dy = e.changedTouches[0].clientY - sy;
          const c = cards[i];
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            if (typing) skip = true;
            hint.classList.add("gone");
            return;
          } // tap = completar
          if (Math.abs(dx) > Math.abs(dy)) {
            // horizontal
            if (Math.abs(dx) > 45) dx < 0 ? next() : prev();
          } else if (Math.abs(dy) > 45) {
            // vertical
            if (canScroll(c)) {
              // respeta scroll de páginas largas
              const atTop = c.scrollTop <= 2,
                atBottom = c.scrollTop + c.clientHeight >= c.scrollHeight - 2;
              if (dy < 0 && atBottom) next();
              else if (dy > 0 && atTop) prev();
            } else {
              dy < 0 ? next() : prev();
            } // arriba = siguiente, abajo = anterior
          }
          hint.classList.add("gone");
        },
        { passive: true },
      );
      stage.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        hint.classList.add("gone");
      });
      // rueda del mouse / trackpad (desktop)
      let wlock = false;
      stage.addEventListener(
        "wheel",
        (e) => {
          if (canScroll(cards[i])) return;
          if (wlock) return;
          wlock = true;
          setTimeout(() => (wlock = false), 650);
          e.deltaY > 0 ? next() : prev();
          hint.classList.add("gone");
        },
        { passive: true },
      );

      render();
    </script>
  </body>
</html>
