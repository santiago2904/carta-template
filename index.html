<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Para ti, Kata</title>
    <style>
      :root {
        /* paleta azul baby (los nombres --rose/--gold se conservan como
           "acento" y "acento claro" para no tocar el resto del CSS) */
        --paper: #f2fafe;
        --paper-2: #dff0fb;
        --ink: #22394a;
        --ink-soft: #587287;
        --rose: #5b9dc9;
        --rose-deep: #2f6c96;
        --gold: #9ecfea;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
          Georgia, serif;
        --script: "Snell Roundhand", "Segoe Script", "Bradley Hand", cursive;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--serif);
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 15% -10%, #f7fdff 0%, transparent 60%),
          radial-gradient(
            800px 600px at 110% 115%,
            #bfe3f6 0%,
            transparent 55%
          ),
          linear-gradient(160deg, #eaf6fd, #cfe8f8);
        -webkit-font-smoothing: antialiased;
        touch-action: pan-y;
      }
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .ic {
        position: absolute;
        color: var(--rose);
        animation: drift 18s ease-in-out infinite;
      }
      .ic.g {
        color: var(--gold);
      }
      .ic svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ic.emo {
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        filter: grayscale(0.2) sepia(0.1);
      }
      @keyframes drift {
        0%,
        100% {
          transform: translateY(0) rotate(var(--r, 0deg));
        }
        50% {
          transform: translateY(-14px) rotate(calc(var(--r, 0deg) + 4deg));
        }
      }

      .book {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
      }
      .stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        padding: calc(env(safe-area-inset-top) + 34px) 26px 26px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        pointer-events: none;
      }
      .card.active {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .wrap {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      p {
        font-size: 19px;
        line-height: 1.72;
        color: var(--ink);
        text-wrap: pretty;
        min-height: 1.2em;
      }
      p.soft {
        color: var(--ink-soft);
        font-style: italic;
      }
      p.lead {
        font-size: 22px;
        line-height: 1.55;
      }
      p.accent {
        font-size: 24px;
        line-height: 1.4;
        color: var(--rose-deep);
        font-weight: 600;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--rose-deep);
        opacity: 0;
        transition: opacity 0.6s ease 0.1s;
      }
      .active .eyebrow {
        opacity: 0.9;
      }

      /* typewriter cursor */
      .tw.typing::after {
        content: "▌";
        color: var(--rose);
        margin-left: 1px;
        animation: blink 0.9s steps(1) infinite;
        font-weight: 400;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* cover */
      .cover {
        text-align: center;
        align-items: center;
        justify-content: center;
      }
      .cover .heart {
        font-size: 50px;
        color: var(--rose);
        animation: beat 2.4s ease-in-out infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        12% {
          transform: scale(1.18);
        }
        24% {
          transform: scale(1);
        }
      }
      .cover h1 {
        font-family: var(--script);
        font-size: clamp(46px, 15vw, 80px);
        max-width: 100%;
        color: var(--rose-deep);
        font-weight: 400;
        line-height: 1;
        margin: 8px 0 16px;
      }
      .cover .sub {
        color: var(--ink-soft);
        font-style: italic;
        font-size: 17px;
      }

      p.sign {
        font-family: var(--script);
        font-size: 44px;
        color: var(--rose-deep);
        line-height: 1;
        margin-top: 2px;
      }
      p.pd {
        font-size: 15px;
        color: var(--ink-soft);
        border-top: 1px solid rgba(158, 207, 234, 0.6);
        padding-top: 16px;
        margin-top: 8px;
        font-style: italic;
      }

      .after {
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
        pointer-events: none;
      }
      .after.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .spotify {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        align-self: flex-start;
        background: #1db954;
        color: #fff;
        text-decoration: none;
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 600;
        padding: 15px 22px;
        border-radius: 999px;
        box-shadow: 0 10px 24px -6px rgba(29, 185, 84, 0.6);
      }
      .spotify:active {
        transform: scale(0.97);
      }
      .spotify svg {
        width: 21px;
        height: 21px;
        fill: #fff;
      }

      /* nav */
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px calc(env(safe-area-inset-bottom) + 16px);
      }
      .progress {
        flex: 1;
        height: 4px;
        border-radius: 99px;
        background: rgba(47, 108, 150, 0.18);
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--rose), var(--gold));
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      .count {
        font-size: 13px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: center;
      }
      .arrow {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(91, 157, 201, 0.45);
        color: var(--rose-deep);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .arrow:disabled {
        opacity: 0.3;
      }
      .arrow:active:not(:disabled) {
        background: var(--rose);
        color: #fff;
      }

      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 16px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
        font-style: italic;
        opacity: 0.75;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      .hint.gone {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: opacity 0.2s;
        }
        .tw.typing::after {
          display: none;
        }
      }
      @media (min-width: 640px) {
        p {
          font-size: 20px;
        }
        .card {
          padding-top: 60px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="ic-palm" viewBox="0 0 24 24">

          />
          <path
            d="M2 17.4c1.6 0 2.3-1.2 3.9-1.2s2.3 1.2 3.9 1.2 2.3-1.2 3.9-1.2 2.3 1.2 3.9 1.2 2.3-1.2 3.9-1.2"
          />
          <path d="M4.6 20.8c1.5 0 2.1-1 3.6-1s2.1 1 3.6 1 2.1-1 3.6-1 2.1 1 3.6 1" />
        </symbol>
        <symbol id="ic-heart" viewBox="0 0 24 24">
          <path
            d="M12 20.4S3.5 15.2 3.5 9.4A4.65 4.65 0 0 1 12 6.8a4.65 4.65 0 0 1 8.5 2.6c0 5.8-8.5 11-8.5 11z"

        </symbol>
      </defs>
    </svg>
    <div class="bg" id="bg"></div>
    <div class="book">
      <div class="stage" id="stage"></div>
      <div class="hint" id="hint">
        desliza en cualquier dirección o toca para continuar
      </div>
      <div class="bar">
        <button class="arrow" id="prev" aria-label="Anterior">‹</button>
        <div class="progress"><i id="pfill"></i></div>
        <span class="count" id="count"></span>
        <button class="arrow" id="next" aria-label="Siguiente">›</button>
      </div>
    </div>

    <script>
      const SPOTIFY = "https://open.spotify.com/track/4ZOkfHC38nxSeSqzGE5HFr";

      // ===== Notificación al abrir la carta (ntfy.sh) =====
      // 1) Instala la app "ntfy" en tu celular (iOS/Android) o abre https://ntfy.sh
      // 2) Suscríbete EXACTAMENTE a este tema (topic):
      const NTFY_TOPIC = "carta-kata-santi-4t7wq9"; // <- cámbialo por algo único tuyo
      // 3) Listo: cuando alguien abra la página, te llega un push.
      (async function () {
        try {
          if (!NTFY_TOPIC) return;
          var ua = navigator.userAgent;
          var lang = navigator.language || "";
          var scr = (screen.width || "?") + "x" + (screen.height || "?");
          var when = new Date().toLocaleString("es-CO");
          var geo = "";
          try {
            var r = await fetch("https://ipwho.is/");
            var j = await r.json();
            if (j && j.success !== false) {
              geo = [j.city, j.region, j.country].filter(Boolean).join(", ");
              if (j.connection && j.connection.isp)
                geo += " · " + j.connection.isp;
              if (j.ip) geo += " · IP " + j.ip;
            }
          } catch (e) {}
          var body =
            "📍 " +
            (geo || "ubicación desconocida") +
            "\n" +
            "📱 " +
            ua +
            "\n" +
            "🖥️ " +
            scr +
            " · " +
            lang +
            "\n" +
            "🕒 " +
            when;
          fetch("https://ntfy.sh/" + NTFY_TOPIC, {
            method: "POST",
            body: body,
            headers: {
              Title: "Abrieron la carta",
              Priority: "high",
              Tags: "heart",
            },
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
      const P = [
        { cover: true },
        {
          eyebrow: "Kata",
          lines: [
            ["lead", "Yo quiero intentar esas cosas lindas contigo."],
            [
              "",
              "Porque sé que si nos queremos de verdad y nos comprometemos con lo que tenemos, podemos tener algo muy melo. No perfecto, pero sí nuestro.",
            ],
          ],
        },
        {
          eyebrow: "Lo que tengo para ti",
          lines: [
            ["", "Yo quiero quererte."],
            [
              "accent",
              "Amarte, protegerte, mimarte, respetarte. Cuidarte en serio.",
            ],
            [
              "soft",
              "Y sí, me duele un poquito que no quieras recibir eso, porque es lo más bonito que tengo para dar y quiero dártelo a ti.",
            ],
          ],
        },
        {
          eyebrow: "Sé que no es fácil",
          lines: [
            [
              "",
              "No te estoy hablando desde la ingenuidad. Sé lo difícil que puede ser por todo lo que los dos sabemos: por lo que he visto, por tus amigas, por mis amigos, por todo.",
            ],
            ["lead", "Y aun así estoy dispuesto."],
          ],
        },
        {
          eyebrow: "Y te voy a ser honesto",
          lines: [
            [
              "",
              "No te voy a decir que en un futuro vamos a estar juntos y que voy a estar ahí para ti pase lo que pase, porque eso sería mentirte.",
            ],
            [
              "",
              "No voy a estar cuando no te funcione algo con otra persona, ni cuando te arrepientas porque no te gustó cómo te trataron, ni cuando me veas con alguien más.",
            ],
            ["soft", "Prefiero decirte la verdad hoy que quedarte bien hoy."],
          ],
        },
        {
          eyebrow: "Hay que ser valientes",
          lines: [
            [
              "lead",
              "Y ahora es el momento. No después, no cuando estemos más listos.",
            ],
            [
              "",
              "No creo eso de que si el amor es verdadero va a llegar más adelante y nos va a encontrar solito. El amor no espera: se cuida en el presente, se decide hoy y se hace todo lo posible para que pueda ser.",
            ],
            [
              "soft",
              "Lo que no se cuida hoy simplemente se va, aunque sea verdadero.",
            ],
          ],
        },
        {
          lines: [
            [
              "",
              "Yo creo en aprovechar el momento. En ser valiente e intentarlo ahora, que es cuando se puede.",
            ],
            [
              "",
              "Y si tú no quieres nada, y prefieres seguir viviendo tu vida como la vives, por encima de una relación que podríamos construir, entonces sí: sigue así, tranquila, cada uno por su lado.",
            ],
            [
              "soft",
              "Lo voy a respetar de verdad. Sin reclamos y sin insistir.",
            ],
          ],
        },
        {
          lines: [
            ["", "Pero quería que lo supieras de mi boca y no suponiéndolo:"],
            ["accent", "yo sí quiero, quiero contigo, y quiero ahora."],
          ],
        },
        {
          spotify: true,
          eyebrow: "Una canción",
          lines: [
            ["lead", '"Piénsalo"'],
            ["soft", "Escúchala pensando en mí, aunque sea una vez."],
          ],
        },
      ];

      const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
      const stage = document.getElementById("stage");
      const cards = P.map((pg) => {
        const c = document.createElement("div");
        c.className = "card" + (pg.cover ? " cover" : "");
        const w = document.createElement("div");
        w.className = "wrap";
        c.appendChild(w);
        if (pg.cover) {
          w.innerHTML = `<div class="heart">♥</div><h1>Para ti,<br>Kata</h1><div class="sub">una carta, página por página</div>`;
        } else {
          if (pg.eyebrow) {
            const e = document.createElement("div");
            e.className = "eyebrow";
            e.textContent = pg.eyebrow;
            w.appendChild(e);
          }
          pg.lines.forEach(([cls, t]) => {
            const p = document.createElement("p");
            p.className = "tw " + cls;
            p.dataset.t = t;
            w.appendChild(p);
          });
          if (pg.spotify || pg.last) {
            const a = document.createElement("a");
            a.className = "spotify after";
            a.href = SPOTIFY;
            a.target = "_blank";
            a.rel = "noopener";
            a.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.59 14.44c-.19.31-.59.41-.9.22-2.46-1.5-5.56-1.84-9.21-1.01-.35.08-.7-.14-.78-.49-.08-.35.14-.7.49-.78 4-.92 7.43-.52 10.19 1.16.31.19.41.6.21.9zm1.23-2.73c-.24.38-.74.5-1.12.27-2.81-1.73-7.1-2.23-10.42-1.22-.43.13-.88-.11-1.01-.54-.13-.43.11-.88.54-1.01 3.8-1.15 8.53-.59 11.76 1.39.38.23.5.74.25 1.11zm.11-2.84C14.7 8.87 9.4 8.69 6.3 9.63c-.51.15-1.05-.13-1.2-.64-.15-.51.13-1.05.64-1.2 3.56-1.08 9.42-.87 13.14 1.33.46.27.61.87.34 1.33-.27.45-.87.6-1.33.33z"/></svg> Escuchar la canción`;
            w.appendChild(a);
          }
        }
        stage.appendChild(c);
        return c;
      });

      // ---- fondo con íconos ----
      const ICONS = [
        ["palm", 5, 8, 86, -6, 0.16, 16, 0],
        ["heart", 87, 7, 60, 10, 0.18, 19, 1],
        ["wave", 74, 18, 92, 0, 0.14, 21, 0],
        ["sushi", 9, 28, 70, 6, 0.16, 18, 1],
        ["plane", 89, 38, 58, -6, 0.16, 15, 0],
        ["heart", 6, 45, 58, -8, 0.18, 20, 1],
        ["palm", 86, 58, 80, 8, 0.14, 17, 0],
        ["sushi", 7, 68, 66, 0, 0.16, 22, 1],
        ["plane", 77, 73, 56, -6, 0.15, 16, 0],
        ["wave", 16, 85, 72, 8, 0.15, 19, 1],
        ["heart", 49, 90, 54, 0, 0.13, 18, 0],
        ["sushi", 47, 3, 56, 6, 0.14, 20, 1],
        ["plane", 30, 60, 52, 12, 0.1, 23, 0],
        ["wave", 63, 47, 62, 0, 0.09, 17, 1],
        ["heart", 60, 12, 46, -8, 0.12, 15, 0],
        ["palm", 24, 21, 58, -6, 0.12, 21, 1],
        ["sushi", 83, 52, 60, 6, 0.17, 18, 0],
      ];
      const SVGSET = new Set(["palm", "sushi", "plane", "wave", "heart"]);
      const bg = document.getElementById("bg");
      ICONS.forEach(([t, l, tp, s, r, op, dur, gold], n) => {
        const emoji = !SVGSET.has(t);
        const d = document.createElement("div");
        d.className = "ic" + (gold ? " g" : "") + (emoji ? " emo" : "");
        d.style.cssText =
          `left:${l}%;top:${tp}%;width:${s}px;height:${s}px;opacity:${op};--r:${r}deg;animation-duration:${dur}s;animation-delay:-${n}s` +
          (emoji ? `;font-size:${Math.round(s * 0.9)}px` : "");
        d.innerHTML = emoji
          ? t
          : `<svg viewBox="0 0 24 24"><use href="#ic-${t}"/></svg>`;
        bg.appendChild(d);
      });

      let i = 0,
        typing = false,
        skip = false,
        token = 0;
      const prevB = document.getElementById("prev"),
        nextB = document.getElementById("next");
      const count = document.getElementById("count"),
        pfill = document.getElementById("pfill");
      const hint = document.getElementById("hint");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const delayFor = (ch) => {
        if (".!?…".includes(ch)) return 240;
        if (",;:—".includes(ch)) return 130;
        return 18;
      };

      async function typeCard(c) {
        const my = ++token;
        typing = true;
        skip = false;
        const els = [...c.querySelectorAll(".tw")];
        els.forEach((e) => (e.textContent = ""));
        c.querySelectorAll(".after").forEach((e) => e.classList.remove("show"));
        if (reduced) {
          els.forEach((e) => (e.textContent = e.dataset.t));
          c.querySelectorAll(".after").forEach((e) => e.classList.add("show"));
          typing = false;
          return;
        }
        for (const e of els) {
          e.classList.add("typing");
          const t = e.dataset.t;
          for (let k = 0; k < t.length; k++) {
            if (my !== token) return;
            if (skip) {
              e.textContent = t;
              break;
            }
            e.textContent = t.slice(0, k + 1);
            await sleep(delayFor(t[k]));
          }
          if (my !== token) return;
          e.textContent = t;
          e.classList.remove("typing");
          if (skip) {
            els.forEach((x) => (x.textContent = x.dataset.t));
            break;
          }
          await sleep(200);
        }
        if (my !== token) return;
        c.querySelectorAll(".after").forEach((e) => e.classList.add("show"));
        typing = false;
      }
      function render() {
        cards.forEach((c, n) => c.classList.toggle("active", n === i));
        prevB.disabled = i === 0;
        nextB.disabled = i === P.length - 1;
        count.textContent = i + 1 + " / " + P.length;
        pfill.style.width = (i / (P.length - 1)) * 100 + "%";
        if (!P[i].cover) typeCard(cards[i]);
        else {
          typing = false;
          token++;
        }
      }
      function next() {
        if (typing) {
          skip = true;
          return;
        }
        if (i < P.length - 1) {
          i++;
          render();
        }
      }
      function prev() {
        if (i > 0) {
          i--;
          render();
        }
      }
      nextB.onclick = next;
      prevB.onclick = prev;
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
      });

      const canScroll = (c) => c.scrollHeight - c.clientHeight > 4;
      let sx = 0,
        sy = 0;
      stage.addEventListener(
        "touchstart",
        (e) => {
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
        },
        { passive: true },
      );
      stage.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].clientX - sx,
            dy = e.changedTouches[0].clientY - sy;
          const c = cards[i];
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            if (typing) skip = true;
            hint.classList.add("gone");
            return;
          } // tap = completar
          if (Math.abs(dx) > Math.abs(dy)) {
            // horizontal
            if (Math.abs(dx) > 45) dx < 0 ? next() : prev();
          } else if (Math.abs(dy) > 45) {
            // vertical
            if (canScroll(c)) {
              // respeta scroll de páginas largas
              const atTop = c.scrollTop <= 2,
                atBottom = c.scrollTop + c.clientHeight >= c.scrollHeight - 2;
              if (dy < 0 && atBottom) next();
              else if (dy > 0 && atTop) prev();
            } else {
              dy < 0 ? next() : prev();
            } // arriba = siguiente, abajo = anterior
          }
          hint.classList.add("gone");
        },
        { passive: true },
      );
      stage.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        hint.classList.add("gone");
      });
      // rueda del mouse / trackpad (desktop)
      let wlock = false;
      stage.addEventListener(
        "wheel",
        (e) => {
          if (canScroll(cards[i])) return;
          if (wlock) return;
          wlock = true;
          setTimeout(() => (wlock = false), 650);
          e.deltaY > 0 ? next() : prev();
          hint.classList.add("gone");
        },
        { passive: true },
      );

      render();
    </script>
  </body>
</html>
